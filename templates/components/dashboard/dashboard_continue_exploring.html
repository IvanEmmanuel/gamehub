

<section class="dashboard-section">

    <div class="section-header">

        <div>

            <span class="section-subtitle">
                Sigue descubriendo
            </span>

            <h3 class="section-title">
                Continúa explorando
            </h3>

        </div>

        <a href="{% url 'dashboard_library' %}" class="section-link">

            Ver todos

            <i class="fa-solid fa-arrow-right"></i>

        </a>

    </div>

    <div class="games-grid dashboard-continue-grid">

        {% for entry in keep_exploring %}

            {% include "components/common/cards/game_card.html" with entry=entry %}

        {% empty %}

            <p class="dashboard-continue-empty">
                Aún no tienes juegos en tu biblioteca.
            </p>

        {% endfor %}

    </div>

</section>
