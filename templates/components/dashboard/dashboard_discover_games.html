<section class="dashboard-section">

    <div class="section-header">

        <div>

            <span class="section-subtitle">

                Recomendaciones para ti

            </span>

            <h3 class="section-title">

                Descubre nuevos juegos

            </h3>

        </div>

        <a href="{% url 'public:games_list' %}" class="section-link">

            Explorar catálogo

            <i class="fa-solid fa-arrow-right"></i>

        </a>

    </div>

    <div class="games-grid dashboard-recommendations-grid">

        {% for game in recommendations %}

            {% include "components/common/cards/recommendation_card.html" with game=game %}

        {% empty %}

            <div class="dashboard-recommendations-empty">

                <i class="fa-solid fa-gamepad"></i>

                <p>
                    Aún no tenemos suficientes datos para recomendarte juegos.
                </p>

            </div>

        {% endfor %}

    </div>

</section>
