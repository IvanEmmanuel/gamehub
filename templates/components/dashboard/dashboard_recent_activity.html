<section class="dashboard-card dashboard-activity">

    <div class="activity-header">

        <h3>

            Actividad reciente

        </h3>

        {% comment %} <a href="#">

            Ver todo

        </a> {% endcomment %}

    </div>

    <div class="activity-list">

        {% for activity in recent_activities %}

            {% include "components/common/cards/activity_card.html" with activity=activity %}

        {% empty %}

            <p>
                Aún no tienes actividad reciente.
            </p>

        {% endfor %}

    </div>

</section>
