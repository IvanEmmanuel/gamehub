<section class="profile-form-section">

    <form action="#" method="post">

        <!--====================================
                INFORMACIÓN PERSONAL
        =====================================-->

        <div class="profile-form-card">

            <div class="profile-form-header">

                <h3>

                    <i class="fa-solid fa-user"></i>

                    Información Personal

                </h3>

                <p>

                    Actualiza los datos básicos de tu perfil.

                </p>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>Nombre</label>

                        <input
                            type="text"
                            class="np-input"
                            value="Iván">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>Apellido</label>

                        <input
                            type="text"
                            class="np-input"
                            value="Emmanuel">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>Nombre de usuario</label>

                        <input
                            type="text"
                            class="np-input"
                            value="@ivanemmanuel">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>Correo electrónico</label>

                        <input
                            type="email"
                            class="np-input"
                            value="ivan@email.com">

                    </div>

                </div>

                <div class="col-12">

                    <div class="np-form-group">

                        <label>Biografía</label>

                        <textarea
                            class="np-textarea"
                            rows="5">Backend Developer apasionado por los videojuegos y el desarrollo web.</textarea>

                    </div>

                </div>

            </div>

        </div>


        <!--====================================
                UBICACIÓN
        =====================================-->

        <div class="profile-form-card">

            <div class="profile-form-header">

                <h3>

                    <i class="fa-solid fa-location-dot"></i>

                    Ubicación

                </h3>

                <p>

                    Comparte únicamente la información que quieras mostrar.

                </p>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>Ciudad</label>

                        <input
                            type="text"
                            class="np-input"
                            value="Aguascalientes">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>País</label>

                        <input
                            type="text"
                            class="np-input"
                            value="México">

                    </div>

                </div>

            </div>

        </div>


        <!--====================================
                REDES SOCIALES
        =====================================-->

        <div class="profile-form-card">

            <div class="profile-form-header">

                <h3>

                    <i class="fa-solid fa-share-nodes"></i>

                    Redes Sociales

                </h3>

                <p>

                    Deja vacío cualquier campo que no quieras mostrar en tu perfil.

                </p>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>

                            <i class="fa-brands fa-github"></i>

                            GitHub

                        </label>

                        <input
                            type="text"
                            class="np-input"
                            placeholder="usuario">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>

                            <i class="fa-brands fa-linkedin"></i>

                            LinkedIn

                        </label>

                        <input
                            type="text"
                            class="np-input"
                            placeholder="usuario">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>

                            <i class="fa-brands fa-steam"></i>

                            Steam

                        </label>

                        <input
                            type="text"
                            class="np-input"
                            placeholder="usuario">

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="np-form-group">

                        <label>

                            <i class="fa-brands fa-discord"></i>

                            Discord

                        </label>

                        <input
                            type="text"
                            class="np-input"
                            placeholder="usuario">

                    </div>

                </div>

            </div>

        </div>


        <!--====================================
                BOTÓN
        =====================================-->

        <div class="profile-form-actions">

            <button
                type="submit"
                class="np-btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Guardar cambios

            </button>

        </div>

    </form>

</section>
