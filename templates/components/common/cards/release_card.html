{% load static %}

<div class="release-item">

    {% if game.cover %}

        <img
            src="{{ game.cover.url }}"
            alt="{{ game.name }}"
        >

    {% else %}

        <img
            src="{% static 'assets/images/default-game-cover.png' %}"
            alt="{{ game.name }}"
        >

    {% endif %}

    <div class="release-info">

        <h5>
            {{ game.name }}
        </h5>

        {% if game.release_date %}

            <span>
                {{ game.release_date|date:"d F Y" }}
            </span>

        {% endif %}

    </div>

</div>
