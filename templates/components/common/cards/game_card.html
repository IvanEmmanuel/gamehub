{% load static %}

<article class="dashboard-continue-card">

    <div class="dashboard-continue-card__image">

        {% if entry.game.cover %}

            <img
                src="{{ entry.game.cover.url }}"
                alt="{{ entry.game.name }}"
            >

        {% else %}

            <img
                src="{% static 'assets/images/default-game-cover.png' %}"
                alt="Sin portada"
            >

        {% endif %}

        <div class="dashboard-continue-card__overlay">

            <span class="dashboard-continue-card__status">
                <i class="fa-solid fa-heart"></i>
                En mi biblioteca
            </span>

        </div>

    </div>

    <div class="dashboard-continue-card__content">

        <div class="dashboard-continue-card__genres">

            {% for genre in entry.game.genres.all|slice:":2" %}

                <span>
                    {{ genre.name }}
                </span>

            {% endfor %}

        </div>

        <h4 class="dashboard-continue-card__title">
            {{ entry.game.name }}
        </h4>

        <div class="dashboard-continue-card__date">

            <i class="fa-regular fa-calendar-plus"></i>

            <span>
                Agregado el {{ entry.added_at|date:"d/m/Y" }}
            </span>

        </div>

        <div class="dashboard-continue-card__action">

            <a href="{% url 'public:games_detail' slug=entry.game.slug %}">
                Ver detalles
                <i class="fa-solid fa-arrow-right"></i>
            </a>

        </div>

    </div>

</article>
