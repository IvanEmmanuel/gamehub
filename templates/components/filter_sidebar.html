{% load static %}

<div class="filter-sidebar">

    <!--=========================================
                    ENCABEZADO
    ==========================================-->

    <div class="filter-sidebar-header">

        <h5>
            <i class="fa-solid fa-filter"></i>
            Filtrar Juegos
        </h5>

    </div>


    <!--=========================================
                    BUSCADOR
    ==========================================-->

    <div class="filter-search">

        <form id="game-search" action="#" method="get">

            <input type="text" placeholder="Buscar juegos..." id="searchText" name="q" value="{% if query %}{{ query }}{% endif %}">

            <button type="submit">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>


    <!--=========================================
                    FILTROS
    ==========================================-->
    <form id="game-filters" action="#" method="get">

        <div class="filter-accordion">


            <!--=====================================
                        PLATAFORMA
            ======================================-->

            <div class="filter-section">

                <button type="button" class="filter-section-header">

                    <span>

                        <i class="fa-solid fa-gamepad"></i>

                        Plataforma

                    </span>

                    <i class="fa-solid fa-chevron-down filter-chevron"></i>

                </button>


                <div class="filter-section-content">

                    <label>

                        <input type="checkbox" name="platform" value="PC" {% if "PC" in selected_platforms %}checked{% endif %}>

                        <i class="fa-brands fa-windows platform-icon windows"></i>

                        PC

                    </label>


                    <label>

                        <input type="checkbox" name="platform" value="PlayStation 5" {% if "PlayStation 5" in selected_platforms %}checked{% endif %}>

                        <i class="fa-brands fa-playstation platform-icon playstation"></i>

                        PlayStation 5

                    </label>


                    <label>

                        <input type="checkbox" name="platform" value="Xbox Series X|S" {% if "Xbox Series X|S" in selected_platforms %}checked{% endif %}>

                        <i class="fa-brands fa-xbox platform-icon xbox"></i>

                        Xbox Series X|S

                    </label>


                    <label>

                        <input type="checkbox" name="platform" value="Nintendo Switch" {% if "Nintendo Switch" in selected_platforms %}checked{% endif %}>

                        <i class="fa-solid fa-gamepad platform-icon switch"></i>

                        Nintendo Switch

                    </label>


                    <label>

                        <input type="checkbox" name="platform" value="Steam Deck"  {% if "Steam Deck" in selected_platforms %}checked{% endif %}>

                        <i class="fa-brands fa-steam platform-icon steam"></i>

                        Steam Deck

                    </label>

                </div>

            </div>


            <!--=====================================
                        GÉNERO
            ======================================-->

            <div class="filter-section">

                <button type="button" class="filter-section-header">

                    <span>

                        <i class="fa-solid fa-dice"></i>

                        Género

                    </span>

                    <i class="fa-solid fa-chevron-down filter-chevron"></i>

                </button>


                <div class="filter-section-content">

                    {% for genre in genres %}

                        <label>

                            <input type="checkbox" name="genre" value="{{ genre.id }}" {% if genre.id|stringformat:"s" in selected_genres %}checked{% endif %}>                            

                            {{ genre.name }}

                        </label>

                    {% empty %}

                        <span class="filter-empty">
                            No hay géneros disponibles.
                        </span>

                    {% endfor %}

                </div>

            </div>


            <!--=====================================
                        ESTADO
            ======================================-->

            <div class="filter-section">

                <button type="button" class="filter-section-header">

                    <span>

                        <i class="fa-solid fa-calendar-check"></i>

                        Estado

                    </span>

                    <i class="fa-solid fa-chevron-down filter-chevron"></i>

                </button>


                <div class="filter-section-content">

                    <label>

                        <input type="checkbox" name="status" value="Released" {% if "Released" in selected_statuses %}checked{% endif %}>

                        Lanzados

                    </label>


                    <label>

                        <input type="checkbox" name="status" value="Upcoming" {% if "Upcoming" in selected_statuses %}checked{% endif %}>

                        Próximamente

                    </label>


                    <label>

                        <input type="checkbox" name="status" value="Early Access" {% if "Early Access" in selected_statuses %}checked{% endif %}>

                        Early Access

                    </label>

                </div>

            </div>


            <!--=====================================
                        ORDENAR
            ======================================-->

            <div class="filter-section">

                <button type="button" class="filter-section-header">

                    <span>

                        <i class="fa-solid fa-arrow-down-wide-short"></i>

                        Ordenar por

                    </span>

                    <i class="fa-solid fa-chevron-down filter-chevron"></i>

                </button>


                <div class="filter-section-content">

                    <label>

                        <input type="radio" name="order" value="recent" {% if selected_order == "recent" %}checked{% endif %}>

                        Más recientes

                    </label>


                    <label>

                        <input type="radio" name="order" value="oldest" {% if selected_order == "oldest" %}checked{% endif %}>

                        Más antiguos

                    </label>


                    <label>

                        <input type="radio" name="order" value="name_asc" {% if selected_order == "name_asc" %}checked{% endif %}>

                        Nombre A-Z

                    </label>


                    <label>

                        <input type="radio" name="order" value="name_desc" {% if selected_order == "name_desc" %}checked{% endif %}>

                        Nombre Z-A

                    </label>

                </div>

            </div>

        </div>


        <!--=========================================
                        ACCIONES
        ==========================================-->

        <div class="filter-actions">

            <button type="submit" class="apply-filter">

                <i class="fa-solid fa-filter"></i>

                Aplicar filtros

            </button>


            <a
                href="{% url 'public:games_list' %}{% if query %}?q={{ query|urlencode }}{% endif %}"
                class="clear-filter"
            >
                <i class="fa-solid fa-rotate-left"></i>
                 Limpiar filtros
            </a>

        </div>

    </form>

</div>
